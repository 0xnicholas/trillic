[project]
name = "trillic"
version = "0.1.0"
description = "Self-trained prompt-compression model for tokencamp-pro's refine pipeline; evaluation harness and training assets."
authors = [
    { name = "nicholasli", email = "nicholasli9@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tiktoken>=0.8",
]

[project.scripts]
trillic = "trillic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
