[project]
name = "trillic"
version = "0.1.0"
description = "Self-trained prompt-compression model for tokencamp-pro's refine pipeline; evaluation harness and training assets."
authors = [
    { name = "nicholasli", email = "nicholasli9@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tiktoken>=0.8",
    "tokenizers>=0.20",
]

[project.scripts]
trillic = "trillic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# `delivery verify` load layer (issue #14): real model instantiation for
# the .bert / offsets runtime assertions. Optional by design — the static
# layer and the whole test suite stay green without it (no torch in CI).
load = [
    "transformers>=4.44",
    "torch>=2.2",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
