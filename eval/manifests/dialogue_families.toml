# Multi-turn dialogue scenario-family registry — human-curated, committed.
#
# This file is the SEED-SPLIT AUTHORITY for dialogue load-type data
# (issue #5; docs/data-strategy.md 硬约束 4: 合成生成器共享代码,但场景族/
# 种子分流). Multi-turn conversation history has no public dataset to draw
# from: five families below are ported from the old repo's generator
# (0xnicholas/tokencamp compression/eval/conversation_gen.py, same author)
# and five are new, all handwritten in src/trillic/dialogue.py; entries are
# synthesized by seeded slot variation.
#
# Split discipline: every family owns two DISJOINT integer seed ranges.
#   - eval seeds  -> golden sets (the exam), e.g. the 10-entry pilot
#   - train seeds -> phase-2 training synthesis (same generator code,
#                    never overlapping seeds)
# The loader refuses any registry where the ranges intersect.
#
# `trillic golden manifest-dialogue` merges this registry with the frozen
# golden set into eval/manifests/dialogue.json. Edit here, regenerate there.
#
# fact_types vocabulary: "name" (people/companies/systems), "date"
# (timestamps/deadlines), "decision" (prior decisions/commitments).
# key_points of every entry are history facts of these kinds — never
# behavioral constraints (that is the system_prompt load type) and never
# final-message-only claims.

schema_version = 1

seed_pool_note = "per-family integer seeds; entry id = dlg-<family>-s<seed>; rng derived from sha256('<family>:<seed>')"

[[family]]
name = "support_ticket"
description = "Webhook delivery failure: root cause (egress IP rotation), allowlist fix, retry policy, impact window"
fact_types = ["name", "date", "decision"]
license = "original (ported from 0xnicholas/tokencamp compression/eval/conversation_gen.py — same author)"
train_use = true
eval_seed_range = [101, 110]
train_seed_range = [901, 910]
note = "Ported scenario 1; optional deeper round (signing-secret rotation) spliced by seeded slot."

[[family]]
name = "pair_programming"
