# System-prompt scenario-family registry — human-curated, committed.
#
# This file is the SEED-SPLIT AUTHORITY for system_prompt load-type data
# (issue #4; docs/data-strategy.md 硬约束 4: 合成生成器共享代码,但场景族/
# 种子分流). Production-style system prompts have no public dataset to draw
# from: the family templates are handwritten in src/trillic/sysprompt.py and
# entries are synthesized by seeded slot variation.
#
# Split discipline: every family owns two DISJOINT integer seed ranges.
#   - eval seeds  -> golden sets (the exam), e.g. the 10-entry pilot
#   - train seeds -> phase-2 training synthesis (same generator code,
#                    never overlapping seeds)
# The loader refuses any registry where the ranges intersect.
#
# `trillic golden manifest-sysprompt` merges this registry with the frozen
# golden set into eval/manifests/sysprompt.json. Edit here, regenerate there.
#
# constraint_types vocabulary: "format" (output shape/length), "refusal"
# (must-decline behaviors), "tone" (voice/style). key_points of every entry
# are behavioral constraints of these kinds — never document facts.

schema_version = 1

seed_pool_note = "per-family integer seeds; entry id = sys-<family>-s<seed>; rng derived from sha256('<family>:<seed>')"

[[family]]
name = "support_logistics"
description = "Tier-1 parcel-tracking support: refund refusal, escalation threshold, ticket-quote format, word cap"
constraint_types = ["refusal", "format"]
license = "original (authored in this repo, no third-party content)"
train_use = true
eval_seed_range = [101, 110]
train_seed_range = [901, 910]
note = "Archetype: customer tries to lure a refund promise for a lost parcel."

